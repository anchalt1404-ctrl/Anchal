<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Management</title>
    <link rel="stylesheet" href="{{url_for ('static', filename='style.css')}}">
</head>
<body>

<header>
    <h1>Student Marks Management System</h1>
    <p>Manage student marks and academic results</p>
</header>

<main>
    <section class="card">
        <h2>Enter Student Details</h2>

        <form action="/add" method="POST">
            <label>Student Name</label>
            <input type="text" name="name"
                   placeholder="Enter student name"
                   maxlength="50" required>

            <label>Roll Number</label>
            <input type="number" name="roll"
                   min="1" required>

            <h3>Subject Marks (Out of 100)</h3>

            <label>English</label>
            <input type="number" name="english"
                   min="0" max="100" required>

            <label>Mathematics</label>
            <input type="number" name="maths"
                   min="0" max="100" required>

            <label>Physics</label>
            <input type="number" name="physics"
                   min="0" max="100" required>

            <label>Chemistry</label>
            <input type="number" name="chemistry"
                   min="0" max="100" required>

            <label>Computer Science</label>
            <input type="number" name="computer"
                   min="0" max="100" required>

            <button type="submit">Generate Marksheet</button>
        </form>
    </section>

    <section class="card">
        <h2>Student Records</h2>
        <p>Check all saved student results.</p>
        <a href="/students" class="button">
            View All Records
        </a>
    </section>
</main>

<footer>
    <p>Student Marks Management System | C Programming Project</p>
</footer>

</body>
</html>
